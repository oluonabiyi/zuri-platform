services:
  backend:
    build: ../zuriapp-backend
    env_file: ../zuriapp-backend/.env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      retries: 5

  frontend:
    build: ../zuriapp-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy