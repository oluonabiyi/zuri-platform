# Tells Prometheus to scrape the backend's /metrics endpoint every 30 seconds
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: zuri
spec:
  selector:
    matchLabels:
      app: backend # matches the backend Service's label
  endpoints:
    - port: http # the named port on the Service
      path: /metrics
      interval: 30s
