# Copies API_SECRET_KEY from AWS Secrets Manager into a Kubernetes Secret called backend-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: zuri
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
  data:
    - secretKey: API_SECRET_KEY
      remoteRef:
        key: zuri/dev/backend
        property: API_SECRET_KEY
