# Tells External Secrets Operator to read from AWS Secrets Manager in London.
# No auth block on purpose: it uses the EC2 instance role, so no AWS key exists anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
